[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simple-add"
version = "0.1.0"
authors = [{ name = "Your Name", email = "you@example.com" }]
description = "A simple test package that adds 1+1"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/yourusername/simple-add"

# THIS IS THE FIX:
[tool.hatch.build.targets.wheel]
packages = ["simple_add"]